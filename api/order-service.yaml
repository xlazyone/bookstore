openapi: 3.1.0

info:
  title: order-service
  version: 1.0.0
  description: |
    Сервис заказов: корзина, оформление, жизненный цикл заказа,
    оркестрация саги покупки (резерв → оплата → подтверждение).
    Публичные эндпоинты доступны через API Gateway и требуют JWT.
    Внутренние эндпоинты (тег internal) вызываются другими сервисами
    напрямую, минуя Gateway.
  license:
    name: Educational project
    url: https://example.org/license

servers:
  - url: /
    description: API Gateway (public endpoints)

tags:
  - name: cart
    description: Корзина пользователя
  - name: orders
    description: Заказы
  - name: internal
    description: Внутренние эндпоинты для других сервисов

security:
  - bearerAuth: []

paths:

  /api/v1/cart/items:
    post:
      tags: [cart]
      summary: Добавить книгу в корзину
      operationId: addCartItem
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
            example:
              bookId: "9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a"
              quantity: 2
      responses:
        '200':
          description: Корзина обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/cart:
    get:
      tags: [cart]
      summary: Получить текущую корзину пользователя
      operationId: getCart
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Корзина пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/cart/items/{itemId}:
    delete:
      tags: [cart]
      summary: Удалить позицию из корзины
      operationId: removeCartItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Позиция удалена
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders:
    post:
      tags: [orders]
      summary: Оформить заказ
      description: |
        Создаёт заказ из текущей корзины. Инициирует сагу покупки:
        резерв на складе → платёж → ожидание подтверждения.
        Заголовок Idempotency-Key защищает от дублирования при повторе.
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              currency: RUB
      responses:
        '201':
          description: Заказ создан, ожидает оплаты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [orders]
      summary: Список заказов пользователя
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Страница заказов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrders'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/orders/{id}:
    get:
      tags: [orders]
      summary: Получить заказ по идентификатору
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders/{id}/cancel:
    post:
      tags: [orders]
      summary: Отменить заказ
      description: |
        Возможна только для заказов в статусе PENDING_PAYMENT.
        Публикует order.cancelled, что снимает резерв на складе.
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Заказ отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/orders/{id}:
    get:
      tags: [internal]
      summary: Получить заказ (для других сервисов)
      operationId: getOrderInternal
      security: []
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404': { $ref: '#/components/responses/NotFound' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT от Keycloak, проверяется на API Gateway

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: UUID для трассировки запроса через все сервисы
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID для защиты от дублирования при повторе запроса
      schema: { type: string, format: uuid }
    OrderIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Не авторизован
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Доступ запрещён
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Конфликт состояния (например, заказ уже отменён)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Ошибка бизнес-валидации
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:     { type: string, format: uri }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }
        correlationId: { type: string, format: uuid }
      example:
        type: "https://bookstore.local/errors/conflict"
        title: "Order already cancelled"
        status: 409
        detail: "Order 9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a is already in status CANCELLED"
        instance: "/api/v1/orders/9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a/cancel"
        correlationId: "3f6c2b0e-8d1a-4c57-9e2f-5a1b7c9d0e44"

    AddCartItemRequest:
      type: object
      required: [bookId, quantity]
      properties:
        bookId:   { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }

    CartItem:
      type: object
      required: [itemId, bookId, title, price, quantity]
      properties:
        itemId:   { type: string, format: uuid }
        bookId:   { type: string, format: uuid }
        title:    { type: string }
        price:    { type: number, format: double, minimum: 0 }
        quantity: { type: integer, minimum: 1 }

    Cart:
      type: object
      required: [userId, items, totalAmount, currency]
      properties:
        userId:      { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        totalAmount: { type: number, format: double }
        currency:    { type: string, example: RUB }

    CreateOrderRequest:
      type: object
      properties:
        currency: { type: string, default: RUB }
        comment:  { type: string, maxLength: 500 }

    OrderItem:
      type: object
      required: [bookId, title, price, quantity]
      properties:
        bookId:   { type: string, format: uuid }
        title:    { type: string }
        price:    { type: number, format: double }
        quantity: { type: integer, minimum: 1 }

    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED, EXPIRED]

    Order:
      type: object
      required: [id, userId, status, items, totalAmount, currency, createdAt]
      properties:
        id:          { type: string, format: uuid }
        userId:      { type: string, format: uuid }
        status:      { $ref: '#/components/schemas/OrderStatus' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        totalAmount: { type: number, format: double }
        currency:    { type: string }
        paymentUrl:  { type: string, format: uri, description: Ссылка на оплату во внешнем шлюзе }
        expiresAt:   { type: string, format: date-time, description: Момент истечения резерва }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }
      example:
        id: "9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a"
        userId: "0e1f2d3c-4b5a-6c7d-8e9f-0a1b2c3d4e5f"
        status: PENDING_PAYMENT
        items:
          - bookId: "9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a"
            title: "Мастер и Маргарита"
            price: 900.00
            quantity: 1
        totalAmount: 900.00
        currency: RUB
        paymentUrl: "https://pay.example.com/session/abc123"
        expiresAt: "2026-10-15T18:19:12Z"
        createdAt: "2026-10-15T18:04:12Z"

    OrderSummary:
      type: object
      required: [id, status, totalAmount, currency, createdAt]
      properties:
        id:          { type: string, format: uuid }
        status:      { $ref: '#/components/schemas/OrderStatus' }
        totalAmount: { type: number, format: double }
        currency:    { type: string }
        createdAt:   { type: string, format: date-time }

    PaginatedOrders:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
        page:          { type: integer }
        size:          { type: integer }
        totalElements: { type: integer }
        totalPages:    { type: integer }
