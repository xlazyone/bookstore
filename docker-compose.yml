name: bookstore

services:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bookstore-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: bookstore-mailhog
    hostname: mailhog
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # Web UI
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    container_name: bookstore-catalog
    hostname: catalog-service
    ports:
      - "8001:8001"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CATALOG_DB_DIR: /app/catalog/data
    volumes:
      - catalog-data:/app/catalog/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
  inventory-service:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    container_name: bookstore-inventory
    hostname: inventory-service
    ports:
      - "8002:8002"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      INVENTORY_DB_DIR: /app/inventory/data
      RESERVATION_TTL_MINUTES: "15"
    volumes:
      - inventory-data:/app/inventory/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  catalog-data:
  inventory-data:
