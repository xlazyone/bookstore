name: bookstore

services:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bookstore-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: bookstore-mailhog
    hostname: mailhog
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # Web UI
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    container_name: bookstore-catalog
    hostname: catalog-service
    ports:
      - "8001:8001"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CATALOG_DB_DIR: /app/catalog/data
    volumes:
      - catalog-data:/app/catalog/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
  inventory-service:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    container_name: bookstore-inventory
    hostname: inventory-service
    ports:
      - "8002:8002"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      INVENTORY_DB_DIR: /app/inventory/data
      RESERVATION_TTL_MINUTES: "15"
    volumes:
      - inventory-data:/app/inventory/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mock-payment-gateway:
    build:
      context: .
      dockerfile: mocks/payment-gateway/Dockerfile
    container_name: bookstore-mock-psp
    hostname: mock-payment-gateway
    ports:
      - "8090:8080"
    environment:
      PAYMENT_WEBHOOK_URL: http://payment-service:8004/api/v1/payments/webhook
      PAYMENT_WEBHOOK_SECRET: dev-secret-change-me
      WEBHOOK_DELAY_SECONDS: "3"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  payment-service:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    container_name: bookstore-payment
    hostname: payment-service
    ports:
      - "8004:8004"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_DB_DIR: /app/payment/data
      PAYMENT_GATEWAY_URL: http://mock-payment-gateway:8080
      PAYMENT_WEBHOOK_SECRET: dev-secret-change-me
    volumes:
      - payment-data:/app/payment/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      mock-payment-gateway:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  order-service:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    container_name: bookstore-order
    hostname: order-service
    ports:
      - "8003:8003"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ORDER_DB_DIR: /app/order/data
      CATALOG_URL: http://catalog-service:8001
      INVENTORY_URL: http://inventory-service:8002
      PAYMENT_URL: http://payment-service:8004
      RESERVATION_TTL_MINUTES: "15"
    volumes:
      - order-data:/app/order/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  review-service:
    build:
      context: .
      dockerfile: services/review/Dockerfile
    container_name: bookstore-review
    hostname: review-service
    ports:
      - "8005:8005"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REVIEW_DB_DIR: /app/review/data
    volumes:
      - review-data:/app/review/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  catalog-data:
  inventory-data:
  payment-data:
  order-data:
  review-data:
